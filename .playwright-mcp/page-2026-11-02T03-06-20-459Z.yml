              - paragraph [ref=f7e218]: 总结：用周期股的买入纪律去买成长股的故事——85 元以下小仓参与可以，60 元下方才是显著的安全边际；放进观察名单跟踪先行指标，不以龙头信仰重仓。本报告仅供学习研究，不构成投资建议。
