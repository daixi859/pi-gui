              - paragraph [ref=f17e319]: 加仓信号：储能毛利率连续两季回升至 32%+；AIDC/SST 实质订单落地；欧盟未跟进限制；净现比维持 >1 重回增长。减仓信号：欧盟本土化立法实质推进；储能中标价二次探底；Q4 再现减值集中计提；2027 年盈利指引下修；高管进一步减持。
              - heading "7. 数据抽检（准出流程）" [level=3] [ref=f17e320]
              - paragraph [ref=f17e321]:
                - code [ref=f17e322]: report_audit.py
                - text: 对报告 42 个数据点随机抽取 7 项，从巨潮年报、同花顺、新浪、雪球、证券之星等信息源核验：5 项通过、2 项警告、0 项不通过，判定【准出】。2 个警告均为已标注事项（逆变器份额 55% vs 46.5% 系机构统计口径矛盾，报告正文已如实并列；另一项为抽检表填写口径错误，非报告数据问题）。
              - heading "8. AI 研究局限性声明" [level=3] [ref=f17e323]
              - list [ref=f17e324]:
                - listitem [ref=f17e325]: 信息丰富度评级：A 级。团队按 A 级策略执行了反面检验：四份报告分别推翻了"储能＝第二利润曲线""低 PE＝便宜""136 号文毁掉储能""美国禁令致命"四个市场共识，未复述卖方叙事。
                - listitem [ref=f17e326]: 跨 Agent 冲突已标注：2025 营收 891.84 亿（A 股年报，四源一致，采信）vs 港股招股书 889.14 亿；市值/股价采信工具验算口径（84.40 元，验算偏差 ≤0.04%）。
                - listitem [ref=f17e327]: 数据不足留白：有息负债明细、存货账龄、AIDC 在手订单金额、曹仁贤夫妇港股 IPO 前套现 18.6 亿（单链条来源，待公告核实）。
              - separator [ref=f17e328]
              - paragraph [ref=f17e329]: 总结：用周期股的买入纪律去买成长股的故事——85 元以下小仓参与可以，60 元下方才是显著的安全边际；放进观察名单跟踪先行指标，不以龙头信仰重仓。本报告仅供学习研究，不构成投资建议。
